[project]
name = "vaultscout"
version = "0.1.0"
description = "Semantic search over your Obsidian vault, fully local"
readme = "README.md"
authors = [
    { name = "SkyTger", email = "nickolay.zeynalov@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
vaultscout = "vaultscout:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
